info:
  name: Find pet by ID
  type: http
  seq: 2
  tags:
    - pet

http:
  method: GET
  url: "{{baseUrl}}/pet/:petId"
  params:
    - name: petId
      value: "10"
      type: path
      description: ID of pet to return
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "{{baseUrl}}/pet/:petId"
      method: GET
      params:
        - name: petId
          value: ""
          type: path
          description: ID of pet to return
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid ID supplied
    request:
      url: "{{baseUrl}}/pet/:petId"
      method: GET
      params:
        - name: petId
          value: ""
          type: path
          description: ID of pet to return
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Pet not found
    request:
      url: "{{baseUrl}}/pet/:petId"
      method: GET
      params:
        - name: petId
          value: ""
          type: path
          description: ID of pet to return
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
