info:
  name: Find purchase order by ID
  type: http
  seq: 3
  tags:
    - store

http:
  method: GET
  url: "{{baseUrl}}/store/order/:orderId"
  params:
    - name: orderId
      value: ""
      type: path
      description: ID of pet that needs to be fetched
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "{{baseUrl}}/store/order/:orderId"
      method: GET
      params:
        - name: orderId
          value: ""
          type: path
          description: ID of pet that needs to be fetched
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid ID supplied
    request:
      url: "{{baseUrl}}/store/order/:orderId"
      method: GET
      params:
        - name: orderId
          value: ""
          type: path
          description: ID of pet that needs to be fetched
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Order not found
    request:
      url: "{{baseUrl}}/store/order/:orderId"
      method: GET
      params:
        - name: orderId
          value: ""
          type: path
          description: ID of pet that needs to be fetched
    response:
