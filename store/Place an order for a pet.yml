info:
  name: Place an order for a pet
  type: http
  seq: 2
  tags:
    - store

http:
  method: POST
  url: "{{baseUrl}}/store/order"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "{{baseUrl}}/store/order"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid Order
    request:
      url: "{{baseUrl}}/store/order"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
