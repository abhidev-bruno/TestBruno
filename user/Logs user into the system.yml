info:
  name: Logs user into the system
  type: http
  seq: 5
  tags:
    - user

http:
  method: GET
  url: "{{baseUrl}}/user/login"
  params:
    - name: username
      value: ""
      type: query
      description: The user name for login
    - name: password
      value: ""
      type: query
      description: The password for login in clear text
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
