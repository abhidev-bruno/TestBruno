    description: successful operation
    request:
      url: "{{baseUrl}}/user/login"
      method: GET
      params:
        - name: username
          value: ""
          type: query
          description: The user name for login
        - name: password
          value: ""
          type: query
          description: The password for login in clear text
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid username/password supplied
    request:
      url: "{{baseUrl}}/user/login"
