runtime:
  variables:
    - name: baseUrl
      value: https://petstore.swagger.io/v1
  scripts:
    - type: after-response
      code: |-
        async function retryRequest(maxRetries = 3, delay = 500) {
          let attempt = 0;
          let response;

          while (attempt < maxRetries) {
            response = await bru.sendRequest(req);

            if (response.status === 400) {
              return response;
            }

            attempt++;
            await new Promise(res => setTimeout(res, delay));
          }

          throw new Error("Request failed after retries");
        }

        const resRetry = await retryRequest(3, 1000);

        test("Final response is 400", () => {
          expect(resRetry.status).to.equal(400);
        });

