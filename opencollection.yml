opencollection: 1.0.0

info:
  name: Sample API Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://petstore.swagger.io/v2
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
