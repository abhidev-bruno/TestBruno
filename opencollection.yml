opencollection: 1.0.0

info:
  name: Swagger Petstore
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://petstore.swagger.io/v2
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: "0"
        method: jsonq
      variable:
        name: retryRequestCounterVar
        scope: runtime

docs:
  content: |
    dfsd
